services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: talentbridge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d talentbridge"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/talentbridge
      JWT_SECRET: local-development-access-secret-change-me
      JWT_REFRESH_SECRET: local-development-refresh-secret-change-me
      CORS_ORIGIN: http://localhost:5173
      RESEND_API_KEY:
      EMAIL_FROM: TalentBridge <onboarding@resend.dev>
      MAX_ACTIVE_POSTINGS: 5
      PORT: 4000
      UPLOAD_DIR: /app/uploads
    ports: ["4000:4000"]
    depends_on:
      db:
        condition: service_healthy
    volumes: [uploads:/app/uploads]
    healthcheck:
      test: ["CMD","wget","-qO-","http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000
    ports: ["5173:80"]
    depends_on:
      backend:
        condition: service_healthy
volumes:
  pgdata:
  uploads:
