services:
  - type: web
    name: talentbridge-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: talentbridge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: TalentBridge <onboarding@resend.dev>
      - key: MAX_ACTIVE_POSTINGS
        value: "5"
      - key: PORT
        value: "4000"
      - key: UPLOAD_DIR
        value: /app/uploads

databases:
  - name: talentbridge-db
    databaseName: talentbridge
    user: talentbridge
