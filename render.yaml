services:
  - type: web
    name: talentbridge-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: talentbridge-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: MAX_ACTIVE_POSTINGS
        value: "5"
      - key: PORT
        value: "4000"
databases:
  - name: talentbridge-db
    databaseName: talentbridge
    user: talentbridge
